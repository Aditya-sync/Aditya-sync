<svg width="1200" height="128" viewBox="0 0 1200 128" xmlns="http://www.w3.org/2000/svg"
     font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace">

  <defs>
    <filter id="crimsonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g opacity="0">
    <animate attributeName="opacity"
             from="0" to="1"
             dur="0.6s"
             fill="freeze"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      from="0 8"
                      to="0 0"
                      dur="0.6s"
                      fill="freeze"/>

    <!-- Prompt -->
    <text
      x="349"
      y="14"
      text-anchor="start"
      font-size="12"
      font-weight="400"
      fill="#ff3b3b"
      opacity="0.7"
      font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace">
      aditya@genai:~$ whoami
    </text>

    <!-- Glow -->
    <text
        x="600"
      y="52"
        text-anchor="middle"
        font-size="48"
        font-weight="700"
        fill="#ff3b3b"
        letter-spacing="3"
        filter="url(#crimsonGlow)"
        opacity="0.22">

        <animate attributeName="opacity"
           values="0.12;0.24;0.12"
                 dur="4s"
                 repeatCount="indefinite"/>

        ADITYA
    </text>

    <!-- Crisp title -->
    <text
        x="600"
        y="52"
        text-anchor="middle"
        font-size="48"
        font-weight="700"
        fill="#ff3b3b"
        letter-spacing="3">
        ADITYA
    </text>

    <!-- Subtitle -->
    <text
        x="600"
        y="84"
        text-anchor="middle"
        font-size="14"
        font-weight="500"
      letter-spacing="0.5"
        fill="#D9D9D9">
        Machine Learning • Deep Learning • Embedded Systems • Edge AI

    </text>

    <!-- Tagline -->
    <text
        x="596"
        y="102"
        text-anchor="end"
        font-size="12"
        fill="#9CA3AF">

        Building Intelligent Systems

    </text>

    <!-- Cursor -->
    <text
        x="600"
        y="102"
        text-anchor="start"
        font-size="12"
        fill="#ffffff">

        ▌

        <animate attributeName="opacity"
                 values="1;1;0;0"
                 keyTimes="0;0.45;0.5;1"
                 dur="0.9s"
                 repeatCount="indefinite"/>

    </text>

    <!-- Divider -->
    <line
        x1="40"
        y1="118"
        x2="1160"
        y2="118"
        stroke="#ff3b3b"
        stroke-width="1"
        opacity="0.08"/>

  </g>

</svg>